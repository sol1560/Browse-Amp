name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool xterm imagemagick
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' sh -c 'xterm -geometry 120x36+30+30 & terminal=$!; trap "kill $terminal" EXIT; sleep 2; BROWSE_TEST_DISPLAY=$DISPLAY pnpm exec tsx --test tests/linux.test.ts'
      # Deliberately no tunnels, personal secrets or screenshot/profile uploads.
      # macOS/Windows jobs test Chromium, not native desktop control.
